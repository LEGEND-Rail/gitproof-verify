name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify
    runs-on: [self-hosted, legend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          go test -v -race -covermode=atomic ./...

      - name: Build Binary
        run: |
          mkdir -p bin
          go build -trimpath -o ./bin/gproof-verify ./cmd/gproof-verify

      - name: Verify Self Attestation
        run: |
          ./bin/gproof-verify --dir=.
